<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Play — API Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --border: #1f293d;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1.5rem;
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .app { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 1rem 1.25rem; border-radius: 10px;
        }
        h1 { font-size: 1.2rem; font-weight: 700; color: #fff; }

        .auth-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 0.75rem 1.25rem; border-radius: 10px; font-size: 0.85rem;
        }

        .status { display: flex; align-items: center; gap: 0.5rem; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
        .dot.active { background: var(--success); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
        @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }

        .section {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 10px; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;
        }
        .section-title { font-size: 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

        form { display: flex; flex-direction: column; gap: 0.75rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        input, select, textarea {
            width: 100%; background: #0b1120; border: 1px solid var(--border);
            color: var(--text); padding: 0.5rem 0.75rem; border-radius: 6px; font-family: inherit; font-size: 0.85rem;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

        .btn {
            background: var(--accent); color: #fff; border: none; padding: 0.5rem 1rem;
            border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 0.35rem; justify-content: center;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); }
        .btn-secondary.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-danger { background: var(--danger-bg); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-sm { padding: 0.25rem 0.55rem; font-size: 0.75rem; }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th, td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }

        /* Enhanced Console Styling */
        .console-toolbar {
            display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; justify-content: space-between;
            background: #090d16; padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border);
        }
        .console-filters { display: flex; gap: 0.35rem; }
        .console-search { flex-grow: 1; max-width: 180px; }
        
        .console {
            background: #050811; border: 1px solid var(--border); border-radius: 8px;
            padding: 0.75rem; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
            height: 650px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem;
            scroll-behavior: smooth;
        }
        
        .log-item {
            border: 1px solid var(--border); background: #0b101d; border-radius: 6px;
            overflow: hidden; transition: border-color 0.2s;
        }
        .log-item:hover { border-color: rgba(255, 255, 255, 0.15); }
        .log-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.45rem 0.75rem; background: rgba(255, 255, 255, 0.02); cursor: pointer; user-select: none;
        }
        .log-meta { display: flex; align-items: center; gap: 0.5rem; }
        .badge {
            display: inline-block; padding: 0.15rem 0.4rem; border-radius: 4px;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
        }
        .badge-req { background: rgba(59, 130, 246, 0.2); color: var(--accent); border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-ok { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-err { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-warn { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        
        .log-time { color: var(--muted); font-size: 0.7rem; }
        .log-body { padding: 0.6rem 0.75rem; background: #060912; border-top: 1px solid var(--border); display: block; }
        .log-body.collapsed { display: none; }
        .log-body pre { max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin: 0; font-size: 0.76rem; }
        
        /* Syntax highlighting */
        .json-key { color: #93c5fd; }
        .json-str { color: #a7f3d0; }
        .json-num { color: #fde047; }
        .json-bool { color: #f472b6; }
        .json-null { color: #9ca3af; }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>Let's Play API Test Client</h1>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <label for="baseUrl">Host</label>
                <input type="text" id="baseUrl" value="http://localhost:8080" readonly style="width: 180px; opacity: 0.7; cursor: not-allowed;">
            </div>
        </header>

        <div class="auth-bar">
            <div class="status">
                <div id="dot" class="dot"></div>
                <span id="authInfo" style="font-weight: 500;">Not Authenticated</span>
            </div>
            <button id="logoutBtn" class="btn btn-secondary btn-sm" style="display: none;" onclick="logout()">Logout</button>
        </div>

        <div class="grid">
            <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                
                <!-- Auth Section -->
                <div class="section">
                    <div class="section-title">Authentication</div>
                    <div class="form-grid">
                        <form onsubmit="register(event)">
                            <label>Register</label>
                            <input type="text" id="regName" placeholder="Name" required>
                            <input type="email" id="regEmail" placeholder="Email" required>
                            <input type="password" id="regPass" placeholder="Password" required>
                            <select id="regRole">
                                <option value="USER">USER</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                            <button type="submit" class="btn">Register</button>
                        </form>

                        <form onsubmit="login(event)">
                            <label>Login</label>
                            <input type="email" id="loginEmail" placeholder="Email" required>
                            <input type="password" id="loginPass" placeholder="Password" required>
                            <button type="submit" class="btn" style="margin-top: auto;">Login</button>
                        </form>
                    </div>
                </div>

                <!-- Products Section -->
                <div class="section">
                    <div class="section-title">
                        Products
                        <button class="btn btn-secondary btn-sm" onclick="getProducts()">Refresh</button>
                    </div>

                    <form id="prodForm" onsubmit="saveProduct(event)">
                        <input type="hidden" id="prodId">
                        <div class="form-grid">
                            <div>
                                <label>Name</label>
                                <input type="text" id="prodName" required placeholder="Product Title">
                            </div>
                            <div>
                                <label>Price ($)</label>
                                <input type="number" id="prodPrice" step="0.01" min="0" required placeholder="29.99">
                            </div>
                        </div>
                        <div>
                            <label>Description</label>
                            <input type="text" id="prodDesc" placeholder="Description">
                        </div>
                        <div style="display: flex; gap: 0.5rem;">
                            <button type="submit" id="prodSubmitBtn" class="btn">Create Product</button>
                            <button type="button" id="prodCancelBtn" class="btn btn-secondary" style="display: none;" onclick="cancelEdit()">Cancel</button>
                        </div>
                    </form>

                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Owner ID</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="prodTable">
                            <tr><td colspan="4" style="color: var(--muted); text-align: center;">No products. Click Refresh.</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Users Section (Admin) -->
                <div class="section">
                    <div class="section-title">
                        Users (Admin)
                        <button class="btn btn-secondary btn-sm" onclick="getUsers()">List Users</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr><td colspan="4" style="color: var(--muted); text-align: center;">Click List Users.</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <!-- Enhanced Console Log Section -->
            <div class="section" style="height: 100%;">
                <div class="section-title">
                    <span>Console Log <span id="logCount" style="font-size: 0.75rem; color: var(--muted); font-weight: normal;">(0)</span></span>
                    <button class="btn btn-secondary btn-sm" onclick="clearLog()">Clear Log</button>
                </div>

                <!-- Console Filters & Search -->
                <div class="console-toolbar">
                    <div class="console-filters">
                        <button id="filterAll" class="btn btn-secondary btn-sm active" onclick="setFilter('ALL')">All</button>
                        <button id="filterReq" class="btn btn-secondary btn-sm" onclick="setFilter('REQ')">Requests</button>
                        <button id="filterOk" class="btn btn-secondary btn-sm" onclick="setFilter('OK')">2xx OK</button>
                        <button id="filterErr" class="btn btn-secondary btn-sm" onclick="setFilter('ERR')">Errors</button>
                    </div>
                    <div style="display: flex; gap: 0.35rem; align-items: center;">
                        <button class="btn btn-secondary btn-sm" onclick="collapseAllLogs(true)">Collapse All</button>
                        <input type="text" id="logSearch" class="console-search" placeholder="Filter..." oninput="renderLogs()">
                    </div>
                </div>

                <div id="console" class="console">
                    <div style="color: var(--muted); margin: auto; font-style: italic;">No API logs yet. Perform an action to view request/response telemetry.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem("token") || "";
        let user = null;
        let logs = [];
        let activeFilter = 'ALL';

        window.onload = () => {
            if (token) parseToken();
            updateUI();
        };

        function getHost() { return "http://localhost:8080"; }

        function setFilter(type) {
            activeFilter = type;
            document.querySelectorAll('.console-filters button').forEach(b => b.classList.remove('active'));
            if (type === 'ALL') document.getElementById('filterAll').classList.add('active');
            if (type === 'REQ') document.getElementById('filterReq').classList.add('active');
            if (type === 'OK') document.getElementById('filterOk').classList.add('active');
            if (type === 'ERR') document.getElementById('filterErr').classList.add('active');
            renderLogs();
        }

        function syntaxHighlight(json) {
            if (typeof json !== 'string') {
                json = JSON.stringify(json, null, 2);
            }
            json = escapeHtml(json);
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-num';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-str';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-bool';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function addLog(type, title, data, status = 200) {
            // Auto-collapse older logs to keep console clean and uncluttered
            logs.forEach(l => l.collapsed = true);

            const entry = {
                id: Date.now() + Math.random(),
                type,
                title,
                data,
                status,
                time: new Date().toLocaleTimeString(),
                collapsed: false
            };
            logs.push(entry);
            // Cap log history buffer to maximum 8 items; remove oldest log when exceeding 8
            while (logs.length > 8) logs.shift();

            renderLogs(true);
        }

        function collapseAllLogs(collapse = true) {
            logs.forEach(l => l.collapsed = collapse);
            renderLogs(false);
        }

        function toggleLogCollapse(id) {
            const log = logs.find(l => l.id === id);
            if (log) {
                log.collapsed = !log.collapsed;
                renderLogs(false);
            }
        }

        function copyLog(e, id) {
            e.stopPropagation();
            const log = logs.find(l => l.id === id);
            if (log) {
                const text = typeof log.data === 'object' ? JSON.stringify(log.data, null, 2) : log.data;
                navigator.clipboard.writeText(text).then(() => {
                    alert("Copied log data to clipboard!");
                });
            }
        }

        function renderLogs(autoScroll = false) {
            const c = document.getElementById("console");
            const search = document.getElementById("logSearch").value.toLowerCase();
            document.getElementById("logCount").innerText = `(${logs.length})`;

            let filtered = logs.filter(l => {
                if (activeFilter === 'REQ' && l.type !== 'REQ') return false;
                if (activeFilter === 'OK' && (l.type !== 'RES' || l.status >= 400)) return false;
                if (activeFilter === 'ERR' && (l.type !== 'RES' || l.status < 400)) return false;
                if (search) {
                    const matchTitle = l.title.toLowerCase().includes(search);
                    const matchData = JSON.stringify(l.data).toLowerCase().includes(search);
                    return matchTitle || matchData;
                }
                return true;
            });

            if (filtered.length === 0) {
                c.innerHTML = `<div style="color: var(--muted); margin: auto; font-style: italic;">No matching logs found.</div>`;
                return;
            }

            c.innerHTML = filtered.map(l => {
                let badgeClass = 'badge-req';
                if (l.type === 'RES') {
                    if (l.status >= 200 && l.status < 300) badgeClass = 'badge-ok';
                    else if (l.status >= 400) badgeClass = 'badge-err';
                    else badgeClass = 'badge-warn';
                }

                const prettyData = syntaxHighlight(l.data);

                return `
                    <div class="log-item">
                        <div class="log-header" onclick="toggleLogCollapse(${l.id})">
                            <div class="log-meta">
                                <span class="badge ${badgeClass}">${l.type === 'REQ' ? 'REQ' : l.status}</span>
                                <strong>${escapeHtml(l.title)}</strong>
                            </div>
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <span class="log-time">${l.time}</span>
                                <button class="btn btn-secondary btn-sm" onclick="copyLog(event, ${l.id})">Copy</button>
                                <span style="font-size: 0.75rem; color: var(--muted);">${l.collapsed ? '►' : '▼'}</span>
                            </div>
                        </div>
                        <div class="log-body ${l.collapsed ? 'collapsed' : ''}">
                            <pre>${prettyData}</pre>
                        </div>
                    </div>
                `;
            }).join('');

            if (autoScroll) {
                c.scrollTop = c.scrollHeight;
            }
        }

        function clearLog() {
            logs = [];
            renderLogs();
        }

        function escapeHtml(s) {
            return String(s || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        async function request(path, method = "GET", body = null) {
            const url = getHost() + path;
            const headers = { "Content-Type": "application/json" };
            if (token) headers["Authorization"] = `Bearer ${token}`;

            addLog("REQ", `${method} ${path}`, { url, method, body });

            try {
                const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
                let data = "";
                const ct = res.headers.get("content-type");
                if (ct && ct.includes("application/json")) data = await res.json();
                else data = await res.text();

                addLog("RES", `${res.status} ${res.ok ? 'OK' : 'Error'} ${method} ${path}`, data, res.status);
                return { ok: res.ok, status: res.status, data };
            } catch (err) {
                addLog("RES", `Network Error ${method} ${path}`, err.message, 0);
                return { ok: false, data: err.message };
            }
        }

        function parseToken() {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                user = { sub: payload.sub, role: payload.role || "USER" };
            } catch {
                logout();
            }
        }

        function updateUI() {
            const dot = document.getElementById("dot");
            const info = document.getElementById("authInfo");
            const logoutBtn = document.getElementById("logoutBtn");
            if (token && user) {
                dot.className = "dot active";
                info.innerHTML = `Auth: <strong>${user.sub}</strong> [${user.role}]`;
                logoutBtn.style.display = "inline-block";
            } else {
                dot.className = "dot";
                info.innerText = "Not Authenticated";
                logoutBtn.style.display = "none";
            }
        }

        function logout() {
            token = ""; user = null;
            localStorage.removeItem("token");
            updateUI();
            addLog("REQ", "Logout Executed", "Cleared token from storage.");
        }

        async function register(e) {
            e.preventDefault();
            const body = {
                name: document.getElementById("regName").value,
                email: document.getElementById("regEmail").value,
                password: document.getElementById("regPass").value,
                role: document.getElementById("regRole").value
            };
            const res = await request("/auth/register", "POST", body);
            if (res.ok && res.data.token) {
                token = res.data.token;
                localStorage.setItem("token", token);
                parseToken(); updateUI();
            }
        }

        async function login(e) {
            e.preventDefault();
            const body = {
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPass").value
            };
            const res = await request("/auth/login", "POST", body);
            if (res.ok && res.data.token) {
                token = res.data.token;
                localStorage.setItem("token", token);
                parseToken(); updateUI();
            }
        }

        let productsList = [];

        async function getProducts() {
            const res = await request("/products", "GET");
            const tb = document.getElementById("prodTable");
            if (res.ok && Array.isArray(res.data)) {
                productsList = res.data;
                if (res.data.length === 0) {
                    tb.innerHTML = `<tr><td colspan="4" style="color: var(--muted); text-align: center;">No products.</td></tr>`;
                    return;
                }
                tb.innerHTML = res.data.map(p => `
                    <tr>
                        <td><strong>${escapeHtml(p.name)}</strong></td>
                        <td>$${p.price.toFixed(2)}</td>
                        <td style="font-family: monospace; font-size: 0.75rem;">${escapeHtml(p.userId)}</td>
                        <td>
                            <button class="btn btn-secondary btn-sm" onclick="editProduct('${p.id}')">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="delProduct('${p.id}')">Delete</button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById("prodId").value;
            const name = document.getElementById("prodName").value;
            const price = parseFloat(document.getElementById("prodPrice").value);
            const description = document.getElementById("prodDesc").value;

            const res = id
                ? await request(`/products/${id}`, "PUT", { name, price, description })
                : await request("/products", "POST", { name, price, description });

            if (res.ok) {
                cancelEdit();
                getProducts();
            }
        }

        function editProduct(id) {
            const product = productsList.find(p => p.id === id);
            if (!product) return;
            document.getElementById("prodId").value = product.id;
            document.getElementById("prodName").value = product.name;
            document.getElementById("prodPrice").value = product.price;
            document.getElementById("prodDesc").value = product.description || "";
            document.getElementById("prodSubmitBtn").innerText = "Update Product";
            document.getElementById("prodCancelBtn").style.display = "inline-block";
        }

        function cancelEdit() {
            document.getElementById("prodId").value = "";
            document.getElementById("prodForm").reset();
            document.getElementById("prodSubmitBtn").innerText = "Create Product";
            document.getElementById("prodCancelBtn").style.display = "none";
        }

        async function delProduct(id) {
            if (confirm("Delete product?")) {
                const res = await request(`/products/${id}`, "DELETE");
                if (res.ok) getProducts();
            }
        }

        async function getUsers() {
            const res = await request("/users", "GET");
            const tb = document.getElementById("usersTable");
            if (res.ok && Array.isArray(res.data)) {
                tb.innerHTML = res.data.map(u => `
                    <tr>
                        <td><strong>${escapeHtml(u.name)}</strong></td>
                        <td>${escapeHtml(u.email)}</td>
                        <td>${u.role}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="delUser('${u.id}')">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tb.innerHTML = `<tr><td colspan="4" style="color: var(--danger); text-align: center;">${res.data.message || 'Admin required.'}</td></tr>`;
            }
        }

        async function delUser(id) {
            if (confirm("Delete user and cascade delete products?")) {
                const res = await request(`/users/${id}`, "DELETE");
                if (res.ok) getUsers();
            }
        }
    </script>
</body>
</html>
